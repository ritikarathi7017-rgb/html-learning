<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form action="">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"> 

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="password">Passoword:</label>
        <input type="password" id="password" name="password">

        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"> 

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"> 

        <br><br>

        <label for="">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <label for="skills">Skills:</label>
        

         <input type="checkbox" name="skills" id="html" value="html"><label for="html">HTML</label>
            <input type="checkbox" name="skills" id="css" value="css"><label for="css">CSS</label>
            <input type="checkbox" name="skills" id="js" value="js"><label for="js">JavaScript</label>
            <input type="checkbox" name="skills" id="react" value="react"><label for="react">React</label><br><br>
           
        <br><br>
        <label for="country">Country:</label>
        <select name="country" id="country">
            <option value="">Select Country</option>
            <option value="india">India</option>
            <option value="china">China</option>
            <option value="usa">USA</option>

        </select>
        <br><br>
        <label for="address">Address:</label> 
        <br>
        <textarea name="address" id="address" cols="40" rows="5"></textarea>
        <br><br>
        <button type="submit" title="submit">Submit</button>
    </form>
</body>

</html>
