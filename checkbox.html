<html>
    <head></head>
    <body>
        <h1>My Skills</h1>
        <form action="">
            <label for="name">Name:</label>
            <input type="text" id="name"><br><br>
            <label for="skills">Skills:</label><br>
            <input type="checkbox" name="skills" id="html" value="html"><label for="html">HTML</label><br>
            <input type="checkbox" name="skills" id="css" value="css"><label for="css">CSS</label><br>
            <input type="checkbox" name="skills" id="js" value="js"><label for="js">JavaScript</label><br>
            <input type="checkbox" name="skills" id="react" value="react"><label for="react">React</label><br><br>
            <button>Submit</button>
        </form>
    </body>
</html>
